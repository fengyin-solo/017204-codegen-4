<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="佳贝艾特会员体系与私域运营全景诊断驾驶舱 - 2026战略诊断报告">
    <meta name="theme-color" content="#0a0a0f">
    <title>佳贝艾特 - 会员体系与私域运营全景诊断驾驶舱</title>
    
    <!-- 预加载关键资源 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    
    <!-- 样式文件 -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/loading.css">
</head>
<body>
    <!-- 诊断摘要侧栏 -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="打开诊断摘要">
        <span class="sidebar-toggle-icon">📋</span>
    </button>

    <aside class="diagnostic-sidebar" id="diagnosticSidebar">
        <div class="sidebar-header">
            <h3 class="sidebar-title">
                <span>🔍</span> 诊断摘要
            </h3>
            <button class="sidebar-close" id="sidebarClose" aria-label="关闭侧栏">✕</button>
        </div>
        <div class="sidebar-body" id="sidebarBody">
        </div>
        <div class="sidebar-footer">
            <span class="sidebar-footer-hint">点击断层卡片跳转详情</span>
        </div>
    </aside>

    <!-- 背景效果 -->
    <div class="bg-animation"></div>
    <div class="grid-overlay"></div>
    <div class="particles"></div>
    
    <!-- 主容器 -->
    <div class="container" id="app">
        
        <!-- 头部区域 -->
        <header class="header">
            <div class="header-badge">
                <span>🎯</span>
                <span>2026 战略诊断报告</span>
            </div>
            <h1 class="header-title">佳贝艾特 会员体系与私域运营全景诊断驾驶舱</h1>
            <div class="typewriter">
                <span class="typewriter-text" id="typewriter"></span>
            </div>
        </header>
        
        <!-- 统计卡片区域 -->
        <section class="stats-section">
            <div class="loading-stage stage-grid stage-grid-stats section-gap" id="statsStage" aria-busy="true">
                <div class="stage-skeleton" aria-hidden="true"></div>
                <div class="stage-content">
                    <div class="stats-grid" id="statsGrid">
                        <!-- 由 JS 动态渲染 -->
                    </div>
                </div>
            </div>
        </section>
        
        <!-- 图表区域 -->
        <section class="charts-section">
            <div class="glass-card chart-card">
                <div class="chart-title">
                    <span class="chart-title-icon">📊</span>
                    AARRR 漏斗分析 - 当前转化瓶颈
                </div>
                <div class="chart-container" id="funnelChart"></div>
            </div>
            <div class="glass-card chart-card">
                <div class="chart-title">
                    <span class="chart-title-icon">🎯</span>
                    会员运营能力雷达图 - 现状 vs 标杆
                </div>
                <div class="chart-container" id="radarChart"></div>
            </div>
        </section>
        
        <!-- 战略矩阵区域 -->
        <section class="matrix-section">
            <h2 class="section-title">
                <span class="section-title-icon">📋</span>
                会员战略全景矩阵
            </h2>
            <div class="loading-stage stage-block" id="matrixStage" aria-busy="true">
                <div class="stage-skeleton" aria-hidden="true"></div>
                <div class="stage-content">
                    <div class="glass-card" style="padding: 24px;">
                        <div class="matrix-wrapper">
                            <table class="matrix-table" id="matrixTable">
                                <!-- 由 JS 动态渲染 -->
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 速赢行动清单区域 -->
        <section class="quickwins-section">
            <h2 class="section-title">
                <span class="section-title-icon">⚡</span>
                90天速赢行动清单
            </h2>
            <div class="loading-stage stage-grid stage-grid-quickwins" id="quickwinsStage" aria-busy="true">
                <div class="stage-skeleton" aria-hidden="true"></div>
                <div class="stage-content">
                    <div class="quickwins-grid" id="quickwinsGrid">
                        <!-- 由 JS 动态渲染 -->
                    </div>
                </div>
            </div>
        </section>
        
        <!-- 页脚 -->
        <footer class="footer" style="text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px;">
            <p>© 2026 佳贝艾特 会员运营诊断系统 | 数据更新时间: 2026-02-05</p>
        </footer>
        
    </div>
    
    <!-- JavaScript 文件 -->
    <script src="js/toast.js"></script>
    <script src="js/data.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/components.js"></script>
    <script src="js/loading.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
